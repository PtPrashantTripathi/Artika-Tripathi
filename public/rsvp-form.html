<!doctype html>
<html lang="hi">
  <head><meta charset="utf-8" /><title>RSVP form registration</title></head>
  <body>
    <form name="rsvp" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="rsvp" />
      <input name="name" />
      <input name="attending" type="radio" value="हाँ, अवश्य आएँगे" />
      <input name="attending" type="radio" value="क्षमा करें, नहीं आ पाएँगे" />
      <input name="guests" type="number" />
      <input name="phone" type="tel" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
